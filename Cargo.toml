[package]
name = "cubeaway_wasm"
version = "1.0.0"
edition = "2024"
description = "CubeAway 3D - Complete Rust + WebAssembly Engine (WebGL2 + DOM + WebAudio)"

[lib]
crate-type = ["cdylib"]
path = "rust_src/lib.rs"

[dependencies]
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
glam = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dependencies.web-sys]
version = "0.3"
features = [
  "console",
  "Window",
  "Document",
  "Element",
  "HtmlElement",
  "HtmlCanvasElement",
  "HtmlImageElement",
  "HtmlInputElement",
  "HtmlButtonElement",
  "HtmlAnchorElement",
  "CanvasRenderingContext2d",
  "CanvasGradient",
  "DomRect",
  "Storage",
  "Performance",
  "Location",
  "Navigator",
  "Event",
  "EventTarget",
  "MouseEvent",
  "PointerEvent",
  "TouchEvent",
  "TouchList",
  "Touch",
  "WheelEvent",
  "KeyboardEvent",
  "FocusEvent",
  "Node",
  "NodeList",
  "DomTokenList",
  "CssStyleDeclaration",
  "DocumentFragment",
  "AudioContext",
  "AudioContextState",
  "AudioDestinationNode",
  "AudioNode",
  "AudioParam",
  "AudioBuffer",
  "AudioBufferSourceNode",
  "OscillatorNode",
  "OscillatorType",
  "GainNode",
  "BiquadFilterNode",
  "BiquadFilterType",
  "Request",
  "RequestInit",
  "RequestCache",
  "Response",
  "Headers",
  "WebGl2RenderingContext",
  "WebGlBuffer",
  "WebGlFramebuffer",
  "WebGlProgram",
  "WebGlRenderbuffer",
  "WebGlShader",
  "WebGlTexture",
  "WebGlUniformLocation",
  "WebGlVertexArrayObject",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
